<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>typo</title>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>typo</h1>
        <div class="controls">
          <div class="seg" id="lang" role="group" aria-label="言語">
            <button data-value="ja">日本語</button>
            <button data-value="en">English</button>
          </div>
          <div class="seg" id="mode" role="group" aria-label="モード">
            <button data-value="sentence">文章</button>
            <button data-value="word">単語</button>
          </div>
          <div class="seg" id="duration" role="group" aria-label="制限時間">
            <button data-value="15">15s</button>
            <button data-value="30">30s</button>
            <button data-value="60">60s</button>
            <button data-value="120">120s</button>
          </div>
          <div class="seg" id="toggles" role="group" aria-label="表示">
            <button data-toggle="showRomaji" title="ローマ字の表示を切り替え">ローマ字</button>
            <button data-toggle="showKeyboard" title="苦手キーのキーボードの表示を切り替え">キーボード</button>
          </div>
        </div>
      </header>

      <main>
        <section id="game">
          <div class="live">
            <span class="time" id="time">60</span>
            <span>WPM <b id="live-wpm">0</b></span>
            <span>正確率 <b id="live-acc">100%</b></span>
          </div>
          <div class="prompt" id="prompt">
            <div class="display" id="display"></div>
            <div class="reading" id="reading"></div>
            <div class="romaji" id="romaji"></div>
          </div>
          <div class="next" id="next"></div>
          <p class="hint" id="hint">キーを押すとスタート ・ <kbd>Esc</kbd> でリスタート</p>
        </section>

        <section id="result" hidden>
          <div class="result-main">
            <div class="big"><span id="r-wpm">0</span><small>WPM</small></div>
            <div class="badge" id="r-best" hidden>自己ベスト更新！</div>
          </div>
          <dl class="result-grid">
            <div><dt>KPM</dt><dd id="r-kpm"></dd></div>
            <div><dt>正確率</dt><dd id="r-acc"></dd></div>
            <div><dt>正しい打鍵</dt><dd id="r-correct"></dd></div>
            <div><dt>ミス</dt><dd id="r-miss"></dd></div>
            <div><dt>これまでのベスト</dt><dd id="r-prev"></dd></div>
          </dl>
          <div class="weak">
            <h3>今回ミスが多かったキー</h3>
            <ol id="r-weak"></ol>
          </div>
          <button class="primary" id="retry">もう一度 <kbd>Esc</kbd></button>
        </section>

        <section class="panel keyboard-panel" id="keyboard-panel">
          <div class="panel-head">
            <h2>苦手キー</h2>
            <button class="link" id="clear-keys">リセット</button>
          </div>
          <p class="note">これまでの全プレイでのミス率。色が濃いほど苦手なキーです。</p>
          <div class="keyboard" id="keyboard"></div>
        </section>

        <section class="panel">
          <h2>ベスト記録</h2>
          <table class="records" id="records"></table>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
